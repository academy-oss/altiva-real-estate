name: Sync projects from Zoho CRM

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zoho-project-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Zoho credentials
        id: credentials
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_ORG_ID: "933341039"
        run: |
          set -euo pipefail
          if [ -z "$ZOHO_CLIENT_ID" ] || [ -z "$ZOHO_CLIENT_SECRET" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Zoho client credentials are not configured yet; nothing to sync."
            exit 0
          fi

          token_response="$(curl --fail --silent --show-error --request POST \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "scope=ZohoCRM.modules.custom.READ" \
            --data-urlencode "soid=ZohoCRM.$ZOHO_ORG_ID" \
            --data-urlencode "client_id=$ZOHO_CLIENT_ID" \
            --data-urlencode "client_secret=$ZOHO_CLIENT_SECRET" \
            https://accounts.zoho.com/oauth/v2/token)"
          access_token="$(printf '%s' "$token_response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token", ""))')"
          if [ -z "$access_token" ]; then
            token_error="$(printf '%s' "$token_response" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data.get("error_description") or data.get("error") or "missing access token")')"
            echo "::error::Zoho token request failed: $token_error"
            exit 1
          fi

          echo "::add-mask::$access_token"
          echo "ZOHO_ACCESS_TOKEN=$access_token" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export published projects from Zoho
        if: steps.credentials.outputs.available == 'true'
        run: node scripts/sync-zoho-projects.mjs
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}

      - name: Publish updated project data
        if: steps.credentials.outputs.available == 'true'
        run: |
          if git diff --quiet -- public/data/projects.json public/data/zoho-media; then
            echo "No project changes to publish."
            exit 0
          fi
          git config user.name "ALTIVA Zoho Sync"
          git config user.email "academy@altivaproperties.com"
          git add public/data/projects.json public/data/zoho-media
          git commit -m "Sync published projects from Zoho CRM"
          git push
